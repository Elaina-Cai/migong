spring:
  datasource:
    url: jdbc:mysql://localhost:3306/migong?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
  secret: mySuperSecretKeyForMyGame-CaiJWT!@#   # 至少32字符，生产环境用更复杂的密钥
  expiration: 86400000                    # 24小时（毫秒）